<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>DollaTek RP2040 Type-C to FM-1 wiring (schematic, not to scale)</title>
  <rect width="760" height="660" fill="#ffffff"/>
  <!-- board -->
  <rect x="60" y="60" width="200" height="420" rx="10" fill="#1f2937" stroke="#111" stroke-width="2"/>
  <rect x="125" y="30" width="70" height="44" rx="8" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <text x="210" y="22" fill="#111">USB-C: data cable to the PC</text>
  <rect x="115" y="200" width="90" height="90" fill="#374151" stroke="#9ca3af"/>
  <text x="160" y="240" text-anchor="middle" fill="#e5e7eb">RP2040</text>
  <text x="160" y="258" text-anchor="middle" fill="#9ca3af" font-size="11">(chip side up)</text>
  <rect x="120" y="110" width="34" height="20" rx="3" fill="#e5e7eb"/><text x="137" y="124" text-anchor="middle" font-size="10">BOOT</text>
  <rect x="166" y="110" width="34" height="20" rx="3" fill="#e5e7eb"/><text x="183" y="124" text-anchor="middle" font-size="10">RST</text>
  <circle cx="160" cy="160" r="9" fill="#a78bfa" stroke="#e5e7eb"/><text x="160" y="185" text-anchor="middle" fill="#c4b5fd" font-size="10">RGB? (not used)</text>
  <!-- left pins -->
  <g fill="#f59e0b" stroke="#111">
    <rect x="52" y="86" width="16" height="16"/><rect x="52" y="116" width="16" height="16"/>
    <rect x="52" y="146" width="16" height="16"/><rect x="52" y="176" width="16" height="16"/>
    <rect x="52" y="206" width="16" height="16"/><rect x="52" y="236" width="16" height="16"/>
    <rect x="52" y="266" width="16" height="16"/><rect x="52" y="296" width="16" height="16"/>
    <rect x="52" y="326" width="16" height="16"/><rect x="52" y="356" width="16" height="16"/>
  </g>
  <g fill="#e5e7eb" font-size="12">
    <text x="78" y="99">1 GP0</text><text x="78" y="129">2 GP1</text><text x="78" y="159">3 GND</text>
    <text x="78" y="189">4 GP2</text><text x="78" y="219">5 GP3</text><text x="78" y="249">6 GP4</text>
    <text x="78" y="279">7 GP5</text><text x="78" y="309">8 GND</text><text x="78" y="339">9 GP6</text>
    <text x="78" y="369">10 GP7</text>
  </g>
  <text x="160" y="470" text-anchor="middle" fill="#9ca3af" font-size="11">LED on GP25 (photo; unverified)</text>
  <!-- FM-1 side -->
  <rect x="520" y="140" width="190" height="210" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="615" y="168" text-anchor="middle" font-weight="bold">USB-C plug into the FM-1</text>
  <text x="615" y="186" text-anchor="middle" font-size="11" fill="#374151">breakout or pigtail, pins checked</text>
  <text x="615" y="200" text-anchor="middle" font-size="11" fill="#374151">with a multimeter, not by colour</text>
  <g font-size="12">
    <text x="540" y="230">D+  (A6 / B6)</text>
    <text x="540" y="262">D-  (A7 / B7)</text>
    <text x="540" y="294">GND (A1 A12 B1 B12)</text>
    <text x="540" y="326" fill="#b91c1c">VBUS (A4 A9 B4 B9)</text>
  </g>
  <!-- wires -->
  <path d="M52 94 H30 V500 H470 V226 H532" fill="none" stroke="#16a34a" stroke-width="3"/>
  <path d="M52 124 H22 V516 H478 V258 H532" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M52 154 H14 V532 H486 V290 H532" fill="none" stroke="#111827" stroke-width="3"/>
  <text x="300" y="150" fill="#16a34a" font-size="13">GP0 → D+</text>
  <text x="300" y="172" fill="#2563eb" font-size="13">GP1 → D-</text>
  <text x="300" y="194" fill="#111827" font-size="13">GND → GND</text>
  <!-- VBUS not connected -->
  <path d="M532 322 H500" stroke="#b91c1c" stroke-width="3"/>
  <line x1="490" y1="312" x2="510" y2="332" stroke="#b91c1c" stroke-width="3"/>
  <line x1="510" y1="312" x2="490" y2="332" stroke="#b91c1c" stroke-width="3"/>
  <text x="520" y="372" fill="#b91c1c" font-weight="bold">VBUS: NOT connected</text><text x="520" y="390" fill="#b91c1c" font-weight="bold">(insulate it)</text>
  <text x="40" y="580" fill="#374151" font-size="12">Never connect 3V3 / VBUS / VSYS / VIN of the board to the FM-1.</text>
  <text x="40" y="600" fill="#374151" font-size="12">The FM-1 runs on its own (charged) battery; only D+, D-, GND.</text>
  <text x="40" y="620" fill="#374151" font-size="12">Orientation: USB-C up, components facing you; pin 1 = top left.</text>
  <text x="40" y="644" fill="#6b7280" font-size="11">Schematic drawn for this project; check it against your own board.</text>
</svg>
